name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: |
          xcodegen generate --spec project.yml
          ls -la

      - name: Build archive (unsigned)
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ChatOnSteroids.xcodeproj \
            -scheme ChatOnSteroids \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ChatOnSteroids.xcarchive \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package .ipa
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP_PATH="build/ChatOnSteroids.xcarchive/Products/Applications/ChatOnSteroids.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Archive did not contain the app bundle:"
            find build/ChatOnSteroids.xcarchive -maxdepth 4 -name "*.app" || true
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry ChatOnSteroids-unsigned.ipa Payload
          ls -lh ChatOnSteroids-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatOnSteroids-unsigned-ipa
          path: ios-app/build/ChatOnSteroids-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
